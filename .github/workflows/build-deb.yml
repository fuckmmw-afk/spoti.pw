name: Build JamesDSP deb

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deb:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      PACKAGE_VERSION: 0.50.0-jdsp1
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive
      - name: Install build tools
        run: brew install make dpkg ldid
      - name: Build package
        run: env -u MAKELEVEL gmake -C tweak clean package SG_VERSION="$PACKAGE_VERSION"
      - name: Publish package artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoti.pw-0.50.0-jdsp1
          path: tweak/packages/*.deb
          if-no-files-found: error
